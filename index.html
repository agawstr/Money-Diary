  <div id="navbar" aria-hidden="true"><span id="nb-t"></span></div>

  <div id="status" role="status"></div>

  <div id="filters">
    <div id="flt-info"></div>
  </div>

  <main>
    <section id="view-home"><div id="home"></div></section>

    <section id="view-wal" hidden><div id="wallets"></div></section>

    <section id="view-sum" hidden>
      <div class="col">
      <div id="stats"></div>
      <h2 class="sec">Per bulan</h2>
      <div id="mchart"></div>
      <div class="lgd"><span><i class="e"></i>Pengeluaran</span><span><i class="i"></i>Pemasukan</span></div>
      </div>
      <div class="col">
      <h2 class="sec">Pengeluaran harian</h2>
      <div id="cal-wrap"><div id="cal"></div></div>
      <div class="lgd"><span><i class="c0"></i>Kosong</span><span><i class="c1"></i>Sedikit</span><span><i class="c2"></i>Sedang</span><span><i class="c3"></i>Banyak</span></div>
      <h2 class="sec">Paling sering dibeli</h2>
      <div id="notes"></div>
      </div>
    </section>

    <section id="view-tl" hidden>
      <div id="tl-bar"><input type="search" id="tl-q" placeholder="Cari catatan, kategori, nominal…" aria-label="Cari riwayat" autocomplete="off"></div>
      <div id="timeline"></div>
      <button type="button" class="btn-s" id="tl-more" hidden>Tampilkan lebih banyak</button>
    </section>

    <section id="view-cal" hidden><div id="calv"></div></section>

    <section id="view-st" hidden>
      <div id="st-body"></div>
    </section>

    <section id="view-plan" hidden><div id="budget"></div></section>

    <section id="view-data" hidden>
      <div id="data"></div>
    </section>
  </main>
  <footer class="foot">Data disimpan di perangkat ini, tanpa server. Jangan lupa unduh backup.</footer>

  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grab" aria-hidden="true"></div>
    <button class="x" id="sheet-x" aria-label="Tutup">&times;</button>
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
  </div>
</div>
